name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            bash ./gradlew clean build --no-configuration-cache -Pversion="$VERSION"
          else
            bash ./gradlew clean build --no-configuration-cache
          fi

      - name: Prepare binary release JAR
        shell: bash
        run: |
          mkdir -p build/release-assets
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'the-sulfur-dimension-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "No binary mod JAR found in build/libs" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            asset_name="the-sulfur-dimension-${GITHUB_REF_NAME}.jar"
          else
            asset_name="the-sulfur-dimension-main-latest.jar"
          fi
          cp "$jar_path" "build/release-assets/$asset_name"

      - name: Update rolling main prerelease tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force main-latest "$GITHUB_SHA"
          git push --force origin refs/tags/main-latest

      - name: Publish JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/release-assets/*.jar

      - name: Publish JAR to rolling main prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: Main branch prerelease
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          files: build/release-assets/*.jar

      - name: Remove obsolete rolling prerelease assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS= read -r asset_name; do
            if [[ "$asset_name" != "the-sulfur-dimension-main-latest.jar" ]]; then
              gh release delete-asset main-latest "$asset_name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done < <(gh release view main-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
