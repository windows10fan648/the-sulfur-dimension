name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            bash ./gradlew clean build --no-configuration-cache -Pversion="$VERSION"
          else
            bash ./gradlew clean build --no-configuration-cache
          fi

      - name: Update rolling main prerelease tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force main-latest "$GITHUB_SHA"
          git push --force origin refs/tags/main-latest

      - name: Publish JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/the-sulfur-dimension-*.jar
            !build/libs/*-sources.jar

      - name: Publish JAR to rolling main prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: Main branch prerelease
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          files: |
            build/libs/the-sulfur-dimension-*.jar
            !build/libs/*-sources.jar
